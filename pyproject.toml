[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mafia-env"
version = "0.1.0"
description = "A small, inspectable multi-agent Mafia environment for RL experiments"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.104.0",
    "openenv==0.7.0",
]

[project.scripts]
mafia-env-server = "env.server:main"

[tool.setuptools.packages.find]
include = ["env*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "modal>=1.6.1",
    "pytest>=9.1.1",
]
