spec_version: 1
name: mafia
version: 0.1.0
type: space
runtime: fastapi
app: env.server:app
port: 8000
validation:
  reward:
    range: [-1.0, 1.0]
    oracle_tolerance: 0.0
    floor_margin: 0.1
  resources:
    cpu: 1.0
    memory_mb: 1024
    disk_mb: 512
    episode_timeout_s: 600.0
  capabilities:
    verifier:
      kind: reward_channel
  types:
    tags: [multi-agent, game, partial-observation]
